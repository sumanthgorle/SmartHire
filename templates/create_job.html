{% extends 'base.html' %} {% block title %} Create Job - SmartHire {% endblock %} {% block content %}

<section class="container">

    <div class="form-card">

        <h1>
            Create a New Job
        </h1>

        <p>
            Add the details of the job you want to post.
        </p>

        <br>


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Job Title
                </label>

                <input type="text" name="title" placeholder="Example: Python Developer" required>

            </div>


            <div class="form-group">

                <label>
                    Job Description
                </label>

                <textarea name="description" placeholder="Describe the job responsibilities and requirements" required></textarea>

            </div>


            <div class="form-group">

                <label>
                    Required Skills
                </label>

                <input type="text" name="required_skills" placeholder="Example: Python, Django, SQL, HTML, CSS" required>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input type="text" name="location" placeholder="Example: Hyderabad" required>

            </div>


            <div class="form-group">

                <label>
                    Salary
                </label>

                <input type="number" name="salary" placeholder="Example: 600000" step="0.01" required>

            </div>


            <input type="submit" value="Create Job" class="btn btn-success">

            <a href="{% url 'company_dashboard' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</section>

{% endblock %}
